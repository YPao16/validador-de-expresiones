<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Validador de Expresiones Regulares</title>
</head>
<body class="bg-light d-flex align-items-center justify-content-center vh-100">

    <div class="card shadow p-4" style="width: 400px;">
        <h3 class="text-center mb-4">Validador de Expresiones Regulares</h3>
        
        <div class="mb-3">
            <label class="form-label fw-bold">Expresión Regular:</label>
            <div class="input-group">
                <span class="input-group-text">/</span>
                <input type="text" id="regexInput" class="form-control" placeholder="^[0-9]+$">
                <span class="input-group-text">/</span>
                <input type="text" id="flagsInput" class="form-control" value="g" style="max-width: 60px;">
            </div>
        </div>

        <div class="mb-3">
            <label class="form-label fw-bold">Texto a Evaluar:</label>
            <textarea id="textInput" class="form-control" rows="3" placeholder="Escribe tu texto..."></textarea>
        </div>

        <div class="d-flex gap-2">
            <button id="btnCompare" class="btn btn-primary w-50">Comparar</button>
            <button id="btnClear" class="btn btn-secondary w-50">Limpiar</button>
        </div>

        <div id="customAlert" class="alert d-none text-center" role="alert">
            <span id="alertMessage"></span>
        </div>
    </div>

    <!-- Script empaquetado por Webpack -->
    <script src="bundle.js"></script>
</body>
</html>
